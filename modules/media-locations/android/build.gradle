plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'expo.modules.medialocations'
version = '1.0.0'

android {
    namespace 'expo.modules.medialocations'
    defaultConfig {
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
}
